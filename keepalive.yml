# =============================================================
# 天翼云电脑 GitHub Actions 定时保活
# -------------------------------------------------------------
# 原理：GitHub 服务器按计划启动一个 Ubuntu 运行器，用 Playwright
#       驱动 Chrome 登录天翼云 Web 客户端 pc.ctyun.cn，先检测
#       云电脑是否已有连接：
#       · 已有连接（用户正在使用）→ 本轮跳过、不触发连接，
#         等下一个定时周期再判断（避免踢出正在工作的会话）；
#       · 无人连接 → 点击“进入AI云电脑”建立真实协议层连接并
#         保持约 90 秒（期间每 10 秒移动一次鼠标），重置平台
#         “1 小时无连接自动休眠”计时器。本地电脑/手机全程无需开机。
#
# 【部署前必做】仓库 Settings → Secrets and variables → Actions
#   → New repository secret，添加两条：
#     CTYUN_USERNAME = 天翼云账号（手机号）
#     CTYUN_PASSWORD = 登录密码
#
# 【其他注意】
#   · 定时任务只在仓库默认分支上生效。
#   · GitHub 对连续 60 天无任何提交的仓库会自动停用定时工作流，
#     每隔一两个月提交任意小改动即可（或在 Actions 页手动启用）。
#   · 失败时自动重试一次；仍失败才显示红叉并发邮件。
# =============================================================
name: Cloud-PC-KeepAlive

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟
  workflow_dispatch:          # 支持在 Actions 页面手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright 与浏览器
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 执行保活（失败自动重试一次）
        env:
          CTYUN_USERNAME: ${{ secrets.CTYUN_USERNAME }}
          CTYUN_PASSWORD: ${{ secrets.CTYUN_PASSWORD }}
          HOLD_SECONDS: '90'
        run: python keepalive.py || (sleep 15 && python keepalive.py)

      - name: 上传截图（人工核验连接是否真正建立）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot
          path: screenshot.png
          retention-days: 3
          if-no-files-found: ignore
